name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Cargo check
        run: cargo check --locked

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy (all targets)
        run: cargo clippy --all-targets --locked -- -D warnings -W clippy::pedantic

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

  docs-and-audit:
    # Windows-only: the codebase uses `windows` crate APIs unconditionally;
    # cargo doc and cargo audit both need to compile on the same platform.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build docs
        run: cargo doc --no-deps --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
